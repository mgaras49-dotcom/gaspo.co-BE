# DigitalOcean App Platform spec for gomer.ai (API + SPA frontend).
#
# Create the app from this spec with either:
#   doctl apps create --spec .do/app.yaml
# or by importing the GitHub repo in the DO dashboard (it auto-detects this file).
#
# SECRET values below are placeholders — set the real values in the DO dashboard
# (App → Settings → Environment Variables). Never commit real secrets here.
#
# The API and the frontend share one domain: the API is routed under /api and
# the SPA serves everything else, so browser calls are same-origin (no CORS).
name: gomer
region: nyc

# Dockerfile-built API service.
services:
  - name: api
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: abaidullahhu-boop/gomer
      branch: main
      deploy_on_push: true
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    # Served under /api; App Platform strips this prefix before forwarding,
    # so the Nest routes stay unprefixed (/health, /auth/..., etc.).
    routes:
      - path: /api
    health_check:
      http_path: /health
      initial_delay_seconds: 20
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: PORT
        scope: RUN_TIME
        value: "3000"
      # Bound automatically from the managed databases declared below.
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${gomer-db.DATABASE_URL}
      - key: DATABASE_SSL
        scope: RUN_TIME
        value: "true"
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${gomer-redis.DATABASE_URL}
      # Must match the SPA's VITE_PIPEDREAM_ENVIRONMENT below: Pipedream scopes
      # connect tokens per environment, so a token minted here is rejected by a
      # popup opened in a different one.
      #
      # `development` caps us at 10 external users and requires each of them to
      # be signed in to pipedream.com in the same browser, so real customers
      # cannot connect. `production` (paid Connect plan) lifts both limits and
      # still uses Pipedream's shared OAuth apps — our own OAuth client per
      # provider is only needed to read an end user's OAuth credentials back out
      # of Pipedream's API or to invoke Pipedream workflows, neither of which we
      # do (tool calls go through the remote MCP server).
      - key: PIPEDREAM_ENVIRONMENT
        scope: RUN_TIME
        value: production
      # The SPA is served from this same domain, so the app's own URL is the
      # correct CORS origin.
      - key: FRONTEND_URL
        scope: RUN_TIME
        value: ${APP_URL}
      # OAuth callbacks must include the /api prefix the API is routed under.
      # These exact URLs have to be registered in the Slack and Meta app
      # dashboards, or consent will redirect to a 404.
      - key: SLACK_REDIRECT_URI
        scope: RUN_TIME
        value: ${APP_URL}/api/auth/slack/callback
      - key: META_REDIRECT_URI
        scope: RUN_TIME
        value: ${APP_URL}/api/integrations/meta/callback
      # Meta's hosted MCP server. Without this the Meta connect flow refuses to
      # start (MetaMcpService logs "META_MCP_URL is not set" and every authorize
      # request fails), so an unset value silently breaks Meta Ads onboarding.
      - key: META_MCP_URL
        scope: RUN_TIME
        value: https://mcp.facebook.com/ads
      # Space-separated ad scopes requested during consent.
      - key: META_SCOPES
        scope: RUN_TIME
        value: ads_management ads_read business_management
      # Facebook Login for Business configuration id. The app uses that product
      # rather than classic Facebook Login, which takes its permissions from the
      # configuration instead of the request — so this must be set or the consent
      # screen fails with "App not active". Copy it from the Meta app dashboard
      # under Facebook Login for Business -> Configurations.
      - key: META_LOGIN_CONFIG_ID
        scope: RUN_TIME
        value: "1037664415789349"
      # Who can reach /super-admin, the cross-tenant owner panel. Comma-separated
      # and matched case-insensitively against the email Slack reports for the
      # signed-in user, so an address here only works if it is one someone can
      # actually sign in with.
      #
      # Empty means the panel is unreachable for everyone, which is the correct
      # setting for any deployment that is not the owner's — and the reason this
      # must be set here rather than left to the dashboard: nothing errors when
      # it is missing, the Super Admin nav entry simply never appears.
      #
      # Deliberately not a SECRET. It grants access to every customer's data, so
      # it is worth more as a line in this file that shows up in review than as a
      # value only visible to whoever opens the DO dashboard.
      - key: SUPER_ADMIN_EMAILS
        scope: RUN_TIME
        value: abaid.ullah.hu@gmail.com,matthew@thebusinessbuilders.com
      # ---- Secrets: replace the placeholder values in the DO dashboard ----
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: set-me-in-dashboard
      - key: JWT_REFRESH_SECRET
        scope: RUN_TIME
        type: SECRET
        value: set-me-in-dashboard
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: set-me-in-dashboard
      - key: SLACK_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
        value: set-me-in-dashboard
      - key: SLACK_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: set-me-in-dashboard
      - key: SLACK_SIGNING_SECRET
        scope: RUN_TIME
        type: SECRET
        value: set-me-in-dashboard
      - key: PIPEDREAM_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
        value: set-me-in-dashboard
      - key: PIPEDREAM_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: set-me-in-dashboard
      - key: PIPEDREAM_PROJECT_ID
        scope: RUN_TIME
        type: SECRET
        value: set-me-in-dashboard
      - key: META_OAUTH_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
        value: set-me-in-dashboard
      - key: META_OAUTH_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: set-me-in-dashboard
      # DANGER: both Stripe secrets are live and set in the DigitalOcean
      # dashboard. The empty values below are NOT the current state — applying
      # this file (doctl apps update --spec, or any manual spec re-apply) will
      # overwrite the real keys with an encrypted empty string and silently
      # disable billing. Nothing detects that: checkout starts failing and the
      # Stripe webhook starts rejecting deliveries.
      #
      # Ordinary git pushes are safe — DigitalOcean deploys new code against the
      # stored spec and never reads this file. Only an explicit spec apply does
      # the damage. If you must apply this spec, pull the live one first
      # (doctl apps spec get <app-id>) and edit that instead.
      #
      # Symptom of having done it: POST /billing/webhook returns 503, which the
      # DO edge rewrites to a 504 before it reaches the caller.
      - key: STRIPE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: STRIPE_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ""

# Vite/React SPA. Catches every path not claimed by the /api route above.
static_sites:
  - name: web
    source_dir: /
    github:
      repo: abaidullahhu-boop/gomer.ai-FE
      branch: main
      deploy_on_push: true
    build_command: npm run build
    output_dir: dist
    routes:
      - path: /
    # Rewrites unknown paths to index.html so client-side routing works on
    # deep links / refresh (equivalent to the vercel.json rewrite).
    catchall_document: index.html
    envs:
      # Vite inlines import.meta.env at build time, so this must be BUILD_TIME.
      # Same-origin: the SPA calls the API under /api on its own domain.
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: ${APP_URL}/api
      # Must match the api service's PIPEDREAM_ENVIRONMENT above. BUILD_TIME:
      # Vite inlines this at build, so changing it needs a rebuild, not just a
      # restart.
      - key: VITE_PIPEDREAM_ENVIRONMENT
        scope: BUILD_TIME
        value: production

# Runs schema migrations before each deploy goes live.
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: abaidullahhu-boop/gomer
      branch: main
    run_command: npm run migration:run:prod
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${gomer-db.DATABASE_URL}
      - key: DATABASE_SSL
        scope: RUN_TIME
        value: "true"

# Managed data stores.
#
# Postgres is a dev database, created and managed by App Platform itself.
#
# The cache runs on Valkey 8: REDIS is no longer an engine DigitalOcean offers
# (`doctl databases options engines` lists valkey only). Valkey is a
# wire-compatible fork of Redis, so ioredis and REDIS_URL work unchanged.
# Valkey has no dev tier, so it must be a production cluster created outside
# this spec and attached here by name:
#
#   doctl databases create gomer-valkey --engine valkey --version 8 \
#     --size db-s-1vcpu-1gb --region nyc3 --num-nodes 1
#
# It bills separately (~$15/mo) and is NOT torn down with the app — delete it
# explicitly with `doctl databases delete gomer-valkey`.
databases:
  - name: gomer-db
    engine: PG
    version: "17"
    production: false
  - name: gomer-redis
    engine: VALKEY
    version: "8"
    production: true
    cluster_name: gomer-valkey
